name: Install Lix
description: Install Lix on the runner, caching the installer binary by version.

inputs:
  lix-version:
    description: Lix version to install (e.g. "2.95.2")
    required: false
    default: "2.95.2"

runs:
  using: composite
  steps:
    - name: Cache Lix installer
      id: cache-lix-installer
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/lix-installer
        key: lix-installer-x86_64-linux-${{ inputs.lix-version }}

    - name: Download Lix installer
      if: steps.cache-lix-installer.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -sSf -L "https://install.lix.systems/lix/${{ inputs.lix-version }}/lix-installer-x86_64-linux" \
          -o /tmp/lix-installer
        chmod +x /tmp/lix-installer

    - name: Install Lix
      shell: bash
      # auto-optimise-store uses /nix/store/.links, which breaks with
      # 'cache-nix-action'; Lix enables it by default, so we turn that off.
      run: |
        sudo rm -f /nix/receipt.json
        /tmp/lix-installer install linux --no-confirm --init none --extra-conf 'auto-optimise-store = false'

    - name: Start nix-daemon
      shell: bash
      run: |
        sudo sh -c 'setsid /nix/var/nix/profiles/default/bin/nix-daemon >/tmp/nix-daemon.log 2>&1 </dev/null &'
        for _ in $(seq 1 100); do
          [ -S /nix/var/nix/daemon-socket/socket ] && break
          sleep 0.2
        done
        NIX_REMOTE=daemon /nix/var/nix/profiles/default/bin/nix store ping
