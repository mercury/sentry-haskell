<<: !include ../hpack-defaults.yaml

name:               patrol-optics
version:            0.0.0
build-type:         Simple
synopsis:           Optics (field labels & prisms) for the patrol Sentry types.

# Orphan 'LabelOptic' instances are the entire purpose of this package: patrol's
# types live in 'patrol' and the 'LabelOptic' class lives in 'optics-core', so
# any instance we write here is necessarily an orphan. (Were these upstreamed
# into 'patrol', they would cease to be orphans.)
ghc-options:
  - -Wno-orphans

dependencies:
  - base
  - optics-core ^>= 0.4
  - optics-th ^>= 0.4
  - patrol ^>= 1.2

library:
  source-dirs: library

tests:
  unit:
    source-dirs: tests/unit
    main: Driver.hs
    ghc-options: -g -threaded -rtsopts -with-rtsopts=-N
    build-tools: ["tasty-discover:tasty-discover"]
    dependencies:
      - hspec
      - optics-core
      - patrol
      - patrol-optics
      - tasty
      - tasty-discover
      - tasty-hspec >= 1.2
