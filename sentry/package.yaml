<<: !include ../hpack-defaults.yaml

name:               sentry
version:            0.0.0
build-type:         Simple

# common dependencies, shared between all targets
dependencies:
  # core libraries
  - base
  - async
  - bytestring
  - containers
  - stm
  - text
  - time
  # hackage dependencies
  - aeson
  - atomic-primops
  - attoparsec
  - data-default
  - hs-opentelemetry-instrumentation-http-client
  - http-types
  - patrol ^>= 1.2
  - sentry-core
  - transformers
  - unagi-chan
  - unliftio
  - witch

library:
  source-dirs: library
  dependencies:
    - zlib

# Shared test/bench support: the kent driver and event generators, used by both
# the integration suite and the sentry-profile harness.
internal-libraries:
  testkit:
    source-dirs: testkit
    dependencies:
      - sentry-core
      - directory
      - http-client
      - network
      - typed-process
      - wai
      - warp

executables:
  # End-to-end profiling harness: pushes envelopes through the sync/async HTTP
  # transports against kent. Build under cabal.project.profiling and run with
  # +RTS flags, or measure wall-clock with hyperfine. See `just profile-*`.
  sentry-profile:
    source-dirs: profile
    main: Main.hs
    ghc-options:
      - -g
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-A32M -N"'
    dependencies:
      - sentry
      - testkit
      - http-client

tests:
  unit:
    source-dirs: tests/unit
    main: Driver.hs
    ghc-options:
      - -g
      - -Wno-missed-specialisations
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    build-tools: ["tasty-discover:tasty-discover"]
    dependencies:
      # library under test
      - sentry
      # test frameworks
      - hspec
      - tasty
      - tasty-discover
      - tasty-hspec

  integration:
    source-dirs: tests/integration
    main: Driver.hs
    ghc-options:
      - -g
      - -Wno-missed-specialisations
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    build-tools: ["tasty-discover:tasty-discover"]
    dependencies:
      # library under test
      - sentry
      # kent driver + event generators
      - testkit
      # test frameworks
      - hspec
      - tasty
      - tasty-discover
      - tasty-hspec

benchmarks:
  time:
    source-dirs: benchmarks
    main: Main.hs
    ghc-options:
      - -g
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-A32M -N"'
    dependencies:
      # library under test
      - sentry
      # test frameworks
      - tasty
      - tasty-bench
