<<: !include ../hpack-defaults.yaml

name:               sentry
version:            0.0.0
build-type:         Simple

extra-source-files:
  - testkit/certs/localhost.crt
  - testkit/certs/localhost.key

# common dependencies, shared between all targets
dependencies:
  # core libraries
  - base
  - async
  - bytestring
  - containers
  - stm
  - text
  - time
  # hackage dependencies
  - aeson
  - atomic-primops
  - attoparsec
  - data-default
  - hs-opentelemetry-instrumentation-http-client
  - http-types
  - patrol ^>= 1.2
  - sentry-core
  - transformers
  - unagi-chan
  - unliftio
  - witch

library:
  source-dirs: library
  dependencies:
    - http-client-tls
    - http-semantics
    - http2
    - http2-tls
    - network
    - network-run
    - zlib

# Shared test/bench support: the kent driver and event generators, used by both
# the integration suite and the sentry-profile harness.
internal-libraries:
  testkit:
    source-dirs: testkit
    dependencies:
      - sentry-core
      - directory
      - file-embed
      - http-client
      - network
      - typed-process
      - wai
      - warp
      - warp-tls
      - zlib

executables:
  # End-to-end profiling harness: pushes envelopes through the HTTP/1.1 or
  # HTTP/2 transport against a TLS sink. Build under cabal.project.profiling and
  # run with +RTS flags, or measure wall-clock with hyperfine. See `just
  # profile-*`.
  sentry-profile:
    source-dirs: profile
    main: Main.hs
    ghc-options:
      - -g
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-A32M -N"'
    dependencies:
      - sentry
      - testkit
      - http-client
      # TLS client manager (cert validation disabled) for the HTTP/1.1 leg
      - http-client-tls
      - crypton-connection
      - tls

  # Standalone TLS sink for out-of-process profiling: run `sentry-sink <port>`
  # and point sentry-profile at it via SENTRY_PROFILE_SINK_PORT so the sink's
  # CPU/allocation stays out of the client's profile.
  sentry-sink:
    source-dirs: sink
    main: Main.hs
    ghc-options:
      - -g
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-A32M -N"'
    dependencies:
      - testkit

tests:
  unit:
    source-dirs: tests/unit
    main: Driver.hs
    ghc-options:
      - -g
      - -Wno-missed-specialisations
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    build-tools: ["tasty-discover:tasty-discover"]
    dependencies:
      # library under test
      - sentry
      # test frameworks
      - hspec
      - tasty
      - tasty-discover
      - tasty-hspec

  integration:
    source-dirs: tests/integration
    main: Driver.hs
    ghc-options:
      - -g
      - -Wno-missed-specialisations
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    build-tools: ["tasty-discover:tasty-discover"]
    dependencies:
      # library under test
      - sentry
      # kent driver + event generators
      - testkit
      # test frameworks
      - hspec
      - tasty
      - tasty-discover
      - tasty-hspec
      # settings mapping test
      - http2-tls

benchmarks:
  time:
    source-dirs: benchmarks
    main: Main.hs
    ghc-options:
      - -g
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-A32M -N"'
    dependencies:
      # library under test
      - sentry
      # test frameworks
      - tasty
      - tasty-bench
