verbatim: { cabal-version: 3.0 }

author:             jkachmar
copyright:          2025 jkachmar
maintainer:         stability@mercury.com
license:            MPL-2.0
license-file:       LICENSE
tested-with:        "GHC == { 9.10.3, 9.12.2 }"

language: GHC2024

ghc-options:
  - -g
  - -Weverything
  - -Wno-unsafe # we're not even going to try to comply with Safe Haskell
  - -Wno-missing-safe-haskell-mode
  - -Wno-missing-export-lists
  - -Wno-missing-import-lists
  - -Wno-implicit-prelude
  - -Wno-missing-local-signatures
  - -Wno-prepositive-qualified-module # for some reason ghcid freaks out on this one?
  - -Wno-unused-packages # noisy in development, take this off once things are a little more settled
  - -Wno-all-missed-specialisations

default-extensions:
  - BlockArguments
  - DeriveAnyClass
  - DerivingStrategies
  - ImportQualifiedPost
  - MultiWayIf
  - OverloadedRecordDot
  - OverloadedStrings
  - PatternSynonyms
  - ScopedTypeVariables
  - StrictData
